packages:
  - packages/*
  - apps/*

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
  prisma-zod-generator: true

catalogs:
  prisma:
    prisma: latest

overrides:
  hono@<4.11.4: ">=4.11.4"
  hono@<4.11.7: ">=4.11.7"
  lodash@>=4.0.0 <=4.17.22: ">=4.17.23"
